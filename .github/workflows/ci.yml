name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Standing rule (2026-10-01): a documentation-only change runs no code job.
  # The secret scan (`secret-scan`) has no condition and runs on every change, because a
  # documentation file can hold a leaked secret. A workflow-level `paths` filter would stop it,
  # so this job decides the scope instead. Each code job is fail-closed: it runs unless this job
  # says `code=false`. A failed scope job leaves the output empty, so the code jobs run.
  # Do not test `== 'true'`. `scripts/ci-change-scope.test.sh` covers the script.
  # The daily `dependency-audit.yml` still audits `main`, so a new advisory does not wait for a push.
  scope:
    name: detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Test the scope script
        run: bash scripts/ci-change-scope.test.sh
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$SHA")"
          fi
          # An unknown scope (an empty list) runs the code jobs.
          printf '%s\n' "$files" | bash scripts/ci-change-scope.sh | tee -a "$GITHUB_OUTPUT"

  rust:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  migrations:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: migration validation + RLS presence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v4
      - name: Create database + Supabase auth shims
        run: |
          $PSQL -c "create database fc;"
          $PSQL -d fc -c "create schema if not exists auth;"
          $PSQL -d fc -c "create or replace function auth.uid() returns uuid language sql stable as \$\$ select null::uuid \$\$;"
      - name: Apply migrations (first pass)
        run: |
          for f in supabase/migrations/*.sql; do echo "applying $f"; $PSQL -d fc -f "$f"; done
          $PSQL -d fc -f supabase/seed.sql
      - name: Determinism — reapply migrations + seed
        run: |
          for f in supabase/migrations/*.sql; do $PSQL -d fc -f "$f"; done
          $PSQL -d fc -f supabase/seed.sql
      - name: Assert RLS enabled on customer-facing tables
        run: |
          $PSQL -d fc -t -c "select count(*) from pg_tables t join pg_class c on c.relname = t.tablename where t.schemaname='public' and c.relrowsecurity = false;" | tr -d ' ' > /tmp/unprotected
          echo "tables without RLS: $(cat /tmp/unprotected)"
          test "$(cat /tmp/unprotected)" = "0"
      - name: Assert AuthorForge update eligibility matrix
        run: $PSQL -d fc -f supabase/tests/update_eligibility_matrix.sql
      - name: Assert customer RLS write-denial matrix
        run: $PSQL -d fc -f supabase/tests/rls_customer_write_denial.sql
      - name: Assert append-only ledgers reject UPDATE
        run: |
          set +e
          $PSQL -d fc -c "insert into customer_profiles(auth_user_id) values (gen_random_uuid());"
          $PSQL -d fc -c "with c as (select id from customer_profiles limit 1) insert into usage_events(customer_id, meter_key, amount, period_key, idempotency_key) select c.id,'cloud_tokens',1,'2026-06','ci' from c;"
          $PSQL -d fc -c "update usage_events set amount = 0;"
          if [ $? -eq 0 ]; then echo "ERROR: usage_events UPDATE should have failed"; exit 1; fi
          echo "append-only enforced"

  release-pipeline-smoke:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: release pipeline smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fc
      RELEASE_ARTIFACT_BASE_URL: https://downloads.example.test/authorforge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create database + Supabase auth shims
        run: |
          $PSQL -c "create database fc;"
          $PSQL -d fc -c "create schema if not exists auth;"
          $PSQL -d fc -c "create or replace function auth.uid() returns uuid language sql stable as \$\$ select null::uuid \$\$;"
      - name: Apply migrations + seed
        run: |
          for f in supabase/migrations/*.sql; do echo "applying $f"; $PSQL -d fc -f "$f"; done
          $PSQL -d fc -f supabase/seed.sql
      - name: Run release package publication smoke
        run: bash scripts/release_pipeline_smoke.sh

  update-campaign-http-smoke:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: update campaign HTTP smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fc
      RELEASE_ARTIFACT_BASE_URL: https://downloads.example.test/authorforge
      UPDATE_ROLLOUT_SECRET: update-http-smoke-rollout-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create database + Supabase auth shims
        run: |
          $PSQL -c "create database fc;"
          $PSQL -d fc -c "create schema if not exists auth;"
          $PSQL -d fc -c "create or replace function auth.uid() returns uuid language sql stable as \$\$ select null::uuid \$\$;"
      - name: Apply migrations + seed
        run: |
          for f in supabase/migrations/*.sql; do echo "applying $f"; $PSQL -d fc -f "$f"; done
          $PSQL -d fc -f supabase/seed.sql
      - name: Run update campaign HTTP smoke
        run: bash scripts/update_campaign_http_smoke.sh

  contracts:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: OpenAPI + schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@latest lint contracts/openapi.yaml
      - name: Validate JSON schemas parse
        run: |
          for f in contracts/*.schema.json contracts/events/*.schema.json; do
            echo "checking $f"; node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))";
          done

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      # gitleaks/gitleaks-action@v2 now requires a paid org license
      # (GITLEAKS_LICENSE) for organization accounts. This runs the same
      # open-source scanner directly instead — no license needed, same
      # ruleset (see .gitleaks.toml for the two allowlisted test fixtures).
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        run: gitleaks detect --source . --redact -v

  audit:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
