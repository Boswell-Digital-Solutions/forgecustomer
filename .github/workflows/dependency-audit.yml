name: Scheduled dependency audit

# cargo audit reads the RustSec advisory database at run time, so a new advisory can fail
# an unchanged lockfile. ci.yml audits only on push and pull request; this workflow also
# audits main every day (docs/KNOWN_ISSUES.md, KI-FOC-20260924-002).
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC every day
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/dependency-audit.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: scheduled dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
