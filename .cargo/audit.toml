# cargo-audit configuration. Waivers below MUST carry a justification and are revisited
# whenever the flagged dependency or its parent is upgraded (see docs/SECURITY.md).

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — `rsa` 0.9.x Marvin timing side-channel; no fixed 0.9 release.
    # `rsa` enters Cargo.lock only via `sqlx-mysql`, which this Postgres-only service
    # never enables or compiles (`cargo tree -i rsa` resolves to nothing). The lockfile
    # must still record it because lockfiles cover every feature combination. Remove
    # this waiver when sqlx ships against a fixed `rsa`.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 — `libsqlite3-sys` 0.30.1, C SQLite CVE-2026-119375; fixed in
    # >=0.39.0. Accepted residual risk, not a fix (docs/KNOWN_ISSUES.md KI-FOC-20261109-003).
    # `libsqlite3-sys` enters Cargo.lock only via `sqlx-sqlite`, an optional dependency of
    # `sqlx` and `sqlx-macros-core`. This Postgres-only service never enables the sqlx
    # `sqlite` feature: `cargo tree -i libsqlite3-sys --workspace --all-features
    # --target all -e all` prints nothing. No sqlx release can take the fix: sqlx-sqlite
    # 0.9.0, the newest, requires `libsqlite3-sys >=0.30.1, <0.38.0`.
    # Remove this waiver when ANY of these holds:
    #   1. a sqlx release allows `libsqlite3-sys >=0.39.0`: upgrade, then remove it;
    #   2. `libsqlite3-sys` leaves Cargo.lock;
    #   3. the `cargo tree -i libsqlite3-sys` command above prints anything. The crate is
    #      then reachable through the resolved dependency graph, the exclusion evidence
    #      above is invalid, and the waiver comes out pending a security reassessment.
    "RUSTSEC-2026-0459",
]
